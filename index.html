            PlayCircle: ({size=20, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>,

            BarChart: ({size=20, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" x2="12" y1="20" y2="10"/><line x1="18" x2="18" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="16"/></svg>,
            Mail: ({size=20, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>,
            Lightbulb: ({size=20, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.2 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg>,
            Database: ({size=20, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>,
            X: ({size=20, className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        };

        // --- [OpenAI API Setup] ---
        const DEFAULT_OPENAI_MODEL = "gpt-4o-mini";
        const OPENAI_MODELS = [
            { value: "gpt-4o-mini", label: "gpt-4o-mini · 저비용 기본 추천" },
            { value: "gpt-5-mini", label: "gpt-5-mini · 더 강한 추론 옵션" },
            { value: "gpt-4.1", label: "gpt-4.1 · 문서형 응답에 강한 범용 모델" },
        ];
        const STORAGE_KEYS = {
            apiKey: "openaiApiKey",
            model: "openaiModel"
        };
        const apiKey = ""; // 필요하면 기본 OpenAI API Key를 넣어 사용할 수 있습니다.

        const normalizeSchema = (schema) => {
            if (Array.isArray(schema)) {
                return schema.map(normalizeSchema);
            }

            if (!schema || typeof schema !== "object") {
                return schema;
            }

            const normalized = {};

            Object.entries(schema).forEach(([key, value]) => {
                if (key === "type" && typeof value === "string") {
                    normalized[key] = value.toLowerCase();
                    return;
                }

                if (key === "properties" && value && typeof value === "object") {
                    normalized[key] = Object.fromEntries(
                        Object.entries(value).map(([propKey, propValue]) => [propKey, normalizeSchema(propValue)])
                    );
                    normalized.additionalProperties = false;
                    return;
                }

                normalized[key] = normalizeSchema(value);
            });

            return normalized;
        };

        const extractResponseText = (result) => {
            if (typeof result.output_text === "string" && result.output_text.trim()) {
                return result.output_text.trim();
            }

            const outputText = (result.output || [])
                .flatMap(item => item.content || [])
                .find(content => content.type === "output_text" && typeof content.text === "string");

            if (outputText?.text) {
                return outputText.text.trim();
            }

            const refusal = (result.output || [])
                .flatMap(item => item.content || [])
                .find(content => content.type === "refusal" && typeof content.refusal === "string");

            if (refusal?.refusal) {
                throw new Error(`모델이 요청을 거절했습니다: ${refusal.refusal}`);
            }

            throw new Error("OpenAI 응답에서 텍스트를 찾지 못했습니다.");
        };

        const parseJsonResponse = (text) => {
            const cleaned = text.replace(/```json/gi, "").replace(/```/g, "").trim();
            return JSON.parse(cleaned);
        };

        const parseDurationMs = (value) => {
            if (!value || typeof value !== "string") return null;

            const trimmed = value.trim();
            if (!trimmed) return null;

            if (/^\d+$/.test(trimmed)) {
                return Number(trimmed) * 1000;
            }

            const match = trimmed.match(/^(\d+(?:\.\d+)?)(ms|s|m|h)$/i);
            if (!match) return null;

            const amount = Number(match[1]);
            const unit = match[2].toLowerCase();
            const multipliers = { ms: 1, s: 1000, m: 60000, h: 3600000 };

            return Math.round(amount * multipliers[unit]);
        };

        const getRetryDelayMs = (response, attempt, fallbackDelays) => {
            const retryAfter = parseDurationMs(response.headers.get("retry-after"));
            const resetRequests = parseDurationMs(response.headers.get("x-ratelimit-reset-requests"));
            const resetTokens = parseDurationMs(response.headers.get("x-ratelimit-reset-tokens"));
            const headerDelay = retryAfter ?? resetRequests ?? resetTokens;

            if (headerDelay && headerDelay > 0) {
                return Math.min(headerDelay, 60000);
            }

            return fallbackDelays[Math.min(attempt, fallbackDelays.length - 1)];
        };

        const generateWithOpenAI = async ({ prompt, schema, userApiKey, model = DEFAULT_OPENAI_MODEL }) => {
            const activeKey = (userApiKey || apiKey || "").trim();

            if (!activeKey) {
                throw new Error("OpenAI API 키가 없습니다. 첫 화면에서 유효한 OpenAI API 키를 입력해 주세요.");
            }

            const payload = {
                model,
                input: [
                    {
                        role: "system",
                        content: [
                            {
                                type: "input_text",
                                text: "주어진 요청에 대해 JSON Schema를 엄격히 따르는 JSON만 반환하세요."
                            }
                        ]
                    },
                    {
                        role: "user",
                        content: [
                            {
                                type: "input_text",
                                text: prompt
                            }
                        ]
                    }
                ],
                text: {
                    format: {
                        type: "json_schema",
                        name: "edtech_response",
                        strict: true,
                        schema: normalizeSchema(schema)
                    }
                }
            };

            const delays = [1000, 2000, 4000, 8000, 16000];
            let retries = 5;

            for (let attempt = 0; attempt <= retries; attempt++) {
                try {
                    const response = await fetch("https://api.openai.com/v1/responses", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${activeKey}`
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        const err = await response.text();
                        const lowerErr = err.toLowerCase();

                        if (response.status === 401 || response.status === 403) {
                            throw new Error(`HTTP Error ${response.status}: OpenAI API 키가 올바르지 않거나 권한이 없습니다. 첫 화면에서 유효한 OpenAI API 키를 입력해 주세요.\n\n상세: ${err}`);
                        }
                        if (response.status === 400) {
                            throw new Error(`HTTP Error ${response.status}: OpenAI 요청 형식이 올바르지 않습니다.\n\n상세: ${err}`);
                        }
                        if (response.status === 429) {
                            const retryDelayMs = getRetryDelayMs(response, attempt, delays);

                            if (lowerErr.includes("insufficient_quota") || lowerErr.includes("quota")) {
                                throw new Error(
                                    `HTTP Error 429: 현재 OpenAI 사용 한도 또는 크레딧이 부족합니다.\n\n` +
                                    `확인할 항목:\n` +
                                    `1. OpenAI 프로젝트 결제/크레딧 상태\n` +
                                    `2. 월 사용 한도(usage limit)\n` +
                                    `3. 조직 또는 프로젝트의 모델 사용 권한\n\n` +
                                    `상세: ${err}`
                                );
                            }

                            if (attempt < retries) {
                                await new Promise(res => setTimeout(res, retryDelayMs));
                                continue;
                            }

                            throw new Error(
                                `HTTP Error 429: 요청이 너무 빠르거나 토큰 한도를 초과했습니다.\n\n` +
                                `잠시 후 다시 시도해 주세요. 가능한 원인:\n` +
                                `1. 분당 요청 수(RPM) 초과\n` +
                                `2. 분당 토큰 수(TPM) 초과\n` +
                                `3. 동일 시점 다중 클릭으로 인한 중복 요청\n\n` +
                                `상세: ${err}`
                            );
                        }
                        throw new Error(`OpenAI API 호출 실패 (HTTP ${response.status})\n\n상세: ${err}`);
                    }
                    
                    const result = await response.json();
                    const text = extractResponseText(result);

                    if (!text) {
                        throw new Error("AI 모델이 데이터를 반환하지 않았습니다.");
                    }

                    return parseJsonResponse(text);

                } catch (error) {
                    if (
                        attempt === retries ||
                        error.message.includes("OpenAI API 키가") ||
                        error.message.includes("OpenAI 요청 형식이") ||
                        error instanceof SyntaxError
                    ) {
                        throw error instanceof SyntaxError
                            ? new Error("모델 응답을 JSON으로 해석하지 못했습니다. 잠시 후 다시 시도해 주세요.")
                            : error;
                    }
                    await new Promise(res => setTimeout(res, delays[attempt]));
                }
            }
        };

        const runStructuredGeneration = async ({
            prompt,
            schema,
            apiConfig,
            setAiMessage,
            setIsGenerating,
            setErrorMsg,
            loadingMessage
        }) => {
            setErrorMsg("");
            setAiMessage(loadingMessage);
            setIsGenerating(true);

            try {
                return await generateWithOpenAI({
                    prompt,
                    schema,
                    userApiKey: apiConfig.apiKey,
                    model: apiConfig.model
                });
            } catch (error) {
                setErrorMsg(error.message);
                return null;
            } finally {
                setIsGenerating(false);
            }
        };

        // --- [RAG 데이터 베이스] ---
        const XR_KNOWLEDGE_BASE = {
            1: `[XR콘텐츠 개요] 존 라도프의 메타버스 7개 레이어... VR 역사...`,
            4: `[생성형 AI와 XR] 생성형 AI 모델... 디자이너를 위한 AI... 사례... 윤리적 과제...`,
            5: `[생성형 AI 창작 (실습)] 미드저니(Midjourney) 활용... 고급 프롬프트 기법... 스카이박스 생성 실습...`,
            13: `[XR콘텐츠 사용자 경험 평가] 메타버스 UX 평가 휴리스틱... VR 앵커링 문제... 콘텐츠 IP 보호...`
        };

        const LMS_SECTION_PRESETS = [
            { id: "lms-home", lmsLabel: "강의홈", projectLabel: "교과목 통합 현황", targetMenu: "dashboard", summary: "출석률, 이용률, 학습활동 참여율을 우리 앱의 코스 현황과 연결합니다." },
            { id: "lms-plan", lmsLabel: "강의계획서", projectLabel: "① 강의 설계", targetMenu: "syllabus", summary: "주차별 모듈, 강의설계 추가, AI 자료 생성을 LMS 강의계획서와 대응합니다." },
            { id: "lms-materials", lmsLabel: "학습자료실", projectLabel: "① 강의 자료 / AI 콘텐츠", targetMenu: "syllabus", summary: "주차별 PPT 흐름, 개념 요약, 학습자료 업로드 항목을 연결할 수 있습니다." },

        const parseWeeksFromSyllabusText = (text) => {
            if (!text || !text.trim()) return [];

            const lines = text
                .split(/\r?\n/)
                .map((line) => line.trim())
                .filter(Boolean);

            const parsedWeeks = [];

            lines.forEach((line) => {
                const match = line.match(/^(?:(\d+)\s*주차|week\s*(\d+)|(\d+)\s*주)\s*[:\-)\.]?\s*(.+)$/i);
                if (!match) return;

                const weekNumber = Number(match[1] || match[2] || match[3]);
                const remainder = (match[4] || "").trim();
                if (!weekNumber || !remainder) return;

                const parts = remainder
                    .split(/\s*\|\s*|\s*[-–•]\s+(?=\S)/)
                    .map((part) => part.trim())
                    .filter(Boolean);

                const title = parts[0] || `${weekNumber}주차 강의`;
                const topics = (parts.slice(1).length ? parts.slice(1) : remainder.split(","))
                    .map((topic) => topic.trim())
                    .filter(Boolean);

                const existing = parsedWeeks.find((item) => item.week === weekNumber);
                if (existing) {
                    existing.topics = [...new Set([...existing.topics, ...parts])];
                    return;
                }
                parsedWeeks.push({
                    week: weekNumber,
                    title,
                    topics: topics.length ? topics : [title]
                });
            });

            return parsedWeeks
                .sort((a, b) => a.week - b.week)
                .filter((week, index, array) => array.findIndex((item) => item.week === week.week) === index);
        };

        const extractTextFromSyllabusFile = async (file) => {
            const lowerName = file.name.toLowerCase();

            if (lowerName.endsWith(".docx")) {
                if (!window.mammoth) {
                    throw new Error("DOCX 추출 도구가 로드되지 않았습니다. 잠시 후 다시 시도해 주세요.");
                }

                const arrayBuffer = await file.arrayBuffer();
                const result = await window.mammoth.convertToHtml({ arrayBuffer });
                const document = new DOMParser().parseFromString(result.value || "", "text/html");
                const weeklyRows = [];
                document.querySelectorAll("table").forEach((table) => {
                    let inSchedule = false;
                    table.querySelectorAll("tr").forEach((row) => {
                        const cells = Array.from(row.children).filter((cell) => /^(TD|TH)$/.test(cell.tagName));
                        const values = cells.map((cell) => cell.textContent.trim());
                        if (/^주차$/.test(values[0] || "") && values.some((value) => /학습|내용|목표/.test(value))) {
                            inSchedule = true;
                            return;
                        }
                        if (!inSchedule || !/^0?\d{1,2}(?:\s*주차?)?$/.test(values[0] || "")) return;
                        const week = Number(values[0].replace(/\D/g, ""));
                        if (week < 1 || week > 52 || !values[1]) return;
                        const paragraphs = Array.from(cells[1].querySelectorAll("p")).map((p) => p.textContent.trim()).filter(Boolean);
                        const content = (paragraphs.length ? paragraphs : [values[1]]).join(" | ");
                        weeklyRows.push(`${week}주차: ${content}${values[2] ? ` | ${values[2]}` : ""}`);
                    });
                });
                return weeklyRows.length ? weeklyRows.join("\n") : (document.body.textContent || "").trim();
            }

            if (lowerName.endsWith(".txt") || lowerName.endsWith(".md")) {
                return (await file.text()).trim();
            }

            if (lowerName.endsWith(".doc")) {
                throw new Error("구형 .doc 파일은 브라우저에서 바로 분석하기 어렵습니다. 가능하면 .docx로 저장한 뒤 업로드해 주세요.");
            }

                                        </button>

                                            <span className="flex items-center gap-2"><Icons.FileQuestion size={14} /> 2. 평가 및 과제 설계</span> <Icons.ChevronRight size={14} className="text-slate-400" />

        // 1. 강의 설계
        function SyllabusView({ course, isGenerating, setIsGenerating, setAiMessage, setErrorMsg, apiConfig, onAddWeek, onSaveSyllabusText, onImportSyllabusWeeks }) {
            const [selectedWeek, setSelectedWeek] = useState(null);
            const [generatedMaterial, setGeneratedMaterial] = useState(null);
            const [newWeekNumber, setNewWeekNumber] = useState("");
            const [newWeekTitle, setNewWeekTitle] = useState("");
            const [newWeekTopics, setNewWeekTopics] = useState("");
            const [syllabusDraft, setSyllabusDraft] = useState(course.syllabusText || "");

            useEffect(() => {
                setSyllabusDraft(course.syllabusText || "");
            }, [course.id, course.syllabusText]);

            const buildWeeksFromSyllabusText = async (text) => {
                const directParsedWeeks = parseWeeksFromSyllabusText(text);
                if (directParsedWeeks.length > 0) {
                    return directParsedWeeks;
                }

                const schema = {
                    type: "OBJECT",
                    properties: {
                        weeks: {
                            type: "ARRAY",
                            items: {
                                type: "OBJECT",
                                properties: {
                                    week: { type: "NUMBER" },
                                    title: { type: "STRING" },
                                    topics: { type: "ARRAY", items: { type: "STRING" } }
                                },
                                required: ["week", "title", "topics"]
                            }
                        }
                    },
                    required: ["weeks"]
                };

                const prompt = [
                    `다음 강의계획서 텍스트를 읽고 주차별 강의설계로 구조화하세요.`,
                    `반드시 주차 번호(week), 주차 제목(title), 세부 주제 목록(topics)을 반환하세요.`,
                    `주차가 명시되지 않은 문단은 무시하고, 확인 가능한 주차만 정리하세요.`,
                    "",
                    text
                ].join("\n");

                const result = await runStructuredGeneration({
                    prompt,
                    schema,
                    apiConfig,
                    setAiMessage,
                    setIsGenerating,
                    setErrorMsg,
                    loadingMessage: "강의계획서를 분석해 주차 설계로 변환 중입니다..."
                });

                return (result?.weeks || [])
                    .map((week) => ({
                        week: Number(week.week),
                        title: (week.title || "").trim(),
                        topics: (week.topics || []).map((topic) => topic.trim()).filter(Boolean)
                    }))
                    .filter((week) => week.week && week.title && week.topics.length > 0)
                    .sort((a, b) => a.week - b.week)
                    .filter((week, index, array) => array.findIndex((item) => item.week === week.week) === index);
            };

            const handleGenerateMaterial = async (week) => {
                const schema = { 
                    type: "OBJECT", 
                    properties: { 
                        outline: { type: "ARRAY", items: { type: "STRING" } }, 
                        concept: { type: "STRING" } 
                    }, 
                    required: ["outline", "concept"] 
                };

                const rag = (course.isLinkedToDrive && XR_KNOWLEDGE_BASE[week.week]) ? `[드라이브 RAG]\n${XR_KNOWLEDGE_BASE[week.week]}` : "";
                const prompt = `과목명:${course.title}\n주제:${week.topics.join(',')}\n${rag}\nPPT 아웃라인(outline)과 핵심 개념(concept)을 작성하세요.`;

                const result = await runStructuredGeneration({
                    prompt,
                    schema,
                    apiConfig,
                    setAiMessage,
                    setIsGenerating,
                    setErrorMsg,
                    loadingMessage: `AI가 [${course.title}] ${week.week}주차 데이터를 분석하여 강의 자료를 생성 중입니다...`
                });

                if(result) { 
                    setGeneratedMaterial({ week: week.week, outline: result.outline, concept: result.concept }); 
                    setSelectedWeek(week.week); 
                }
            };

            const handleAddWeek = () => {
                const weekNumber = Number(newWeekNumber);
                const title = newWeekTitle.trim();
                const topics = newWeekTopics
                    .split(",")
                    .map((topic) => topic.trim())
                    .filter(Boolean);

                if (!weekNumber || !title || topics.length === 0) {
                    setErrorMsg("주차 번호, 모듈명, 주제를 모두 입력해 주세요.");
                    return;
                }

                if (course.weeks.some((week) => week.week === weekNumber)) {
                    setErrorMsg(`${weekNumber}주차는 이미 존재합니다. 다른 주차 번호를 입력해 주세요.`);
                    return;
                }

                onAddWeek(course.id, {
                    week: weekNumber,
                    title,
                    topics
                });

                setNewWeekNumber("");
                setNewWeekTitle("");
                setNewWeekTopics("");
                setSelectedWeek(weekNumber);
                setGeneratedMaterial(null);
            };

            const handleSaveSyllabus = () => {
                if (!syllabusDraft.trim()) {
                    setErrorMsg("저장할 강의계획서 내용이 없습니다.");
                    return;
                }

                onSaveSyllabusText(course.id, syllabusDraft.trim());
            };

            const handleImportFromSyllabus = async () => {
                const parsedWeeks = await buildWeeksFromSyllabusText(syllabusDraft);

                if (parsedWeeks.length === 0) {
                    setErrorMsg("강의계획서에서 주차 정보를 찾지 못했습니다. 파일 형식이나 본문 구성을 확인해 주세요.");
                    return;
                }

                onSaveSyllabusText(course.id, syllabusDraft.trim());
                onImportSyllabusWeeks(course.id, parsedWeeks);
                setSelectedWeek(parsedWeeks[0].week);
                setGeneratedMaterial(null);
            };

            const handleSyllabusFileUpload = async (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                try {
                    const extractedText = await extractTextFromSyllabusFile(file);

                    if (!extractedText) {
                        setErrorMsg("업로드한 파일에서 읽을 수 있는 텍스트를 찾지 못했습니다.");
                        return;
                    }

                    setSyllabusDraft(extractedText);
                    onSaveSyllabusText(course.id, extractedText);

                    const parsedWeeks = await buildWeeksFromSyllabusText(extractedText);
                    if (parsedWeeks.length === 0) {
                        setErrorMsg("파일은 읽었지만 주차 구조를 만들지 못했습니다. 강의계획서 내용을 확인해 주세요.");
                        return;
                    }

                    onImportSyllabusWeeks(course.id, parsedWeeks);
                    setSelectedWeek(parsedWeeks[0].week);
                    setGeneratedMaterial(null);
                } catch (error) {
                    setErrorMsg(error.message);
                } finally {
                    event.target.value = "";
                }
            };

            return (
                <div className="p-8 animate-fade-in">
                    <header className="mb-6 flex justify-between items-end border-b border-slate-200 pb-4">
                        <div>
                            <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><Icons.BookOpen className="text-indigo-600"/> ① 강의 설계의 체계화</h2>
                            <p className="text-slate-500 text-sm mt-1">{course.title} 과목의 교육과정을 구성하고 자료를 생성합니다.</p>
                        </div>
                    </header>
                    <div className="space-y-6">
                        <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                            <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icons.FileText size={18} className="text-indigo-600" /> 강의계획서</h3>
                                    <span className="text-xs text-slate-400">저장 후 강의설계로 즉시 변환</span>
                                </div>
                                <div className="space-y-3">
                                    <textarea
                                        value={syllabusDraft}
                                        onChange={(e) => setSyllabusDraft(e.target.value)}
                                        className="w-full border rounded-lg px-3 py-2 text-sm h-44"
                                        placeholder={"예:\n1주차: XR 개요 | 수업 소개 | 평가 안내\n2주차: 유니티 기초 | 인터페이스 | 오브젝트"}
                                    />
                                    <label className="w-full flex items-center justify-center gap-2 bg-slate-50 border border-dashed border-slate-300 text-slate-700 font-bold py-2.5 rounded-lg text-sm hover:bg-slate-100 cursor-pointer">
                                        <Icons.FolderOpen size={16} />
                                        DOC 강의계획서 업로드 후 자동 설계
                                        <input type="file" accept=".doc,.docx,.txt,.md" onChange={handleSyllabusFileUpload} className="hidden" />
                                    </label>
                                    <div className="grid grid-cols-2 gap-2">
                                        <button onClick={handleSaveSyllabus} className="w-full bg-white border border-slate-300 text-slate-700 font-bold py-2.5 rounded-lg text-sm hover:bg-slate-50">
                                            강의계획서 저장
                                        </button>
                                        <button onClick={handleImportFromSyllabus} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-indigo-700">
                                            강의설계로 불러오기
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div className="bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
                                <div className="flex items-center justify-between mb-3">
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icons.PlusCircle size={18} className="text-indigo-600" /> 강의설계 추가</h3>
                                    <span className="text-xs text-slate-400">주차별 모듈 직접 등록</span>
                                </div>
                                <div className="space-y-3">
                                    <div className="grid grid-cols-[110px_1fr] gap-3">
                                        <input value={newWeekNumber} onChange={(e) => setNewWeekNumber(e.target.value)} type="number" min="1" className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="주차" />
                                        <input value={newWeekTitle} onChange={(e) => setNewWeekTitle(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="예: XR 인터랙션 설계" />
                                    </div>
                                    <textarea value={newWeekTopics} onChange={(e) => setNewWeekTopics(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm h-24" placeholder="주제를 쉼표로 구분해 입력하세요. 예: 사용자 여정 설계, 상호작용 시나리오, 평가 기준" />
                                    <button onClick={handleAddWeek} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-slate-800">
                                        강의설계 추가
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                            <div className="px-5 py-4 border-b bg-slate-50 flex flex-wrap items-center justify-between gap-3">
                                <div>
                                    <h3 className="font-bold text-slate-800 flex items-center gap-2"><Icons.GripVertical size={18}/> 주차별 모듈</h3>
                                    <p className="text-xs text-slate-500 mt-1">15주 설계를 염두에 둔 전체 모듈 보기입니다. 각 주차를 선택해 AI 자료를 생성할 수 있습니다.</p>
                                </div>
                                <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-full">
                                    총 {(course.weeks || []).length}개 모듈
                                </span>
                            </div>
                            <div className="p-5">
                                <div className="grid grid-cols-1 md:grid-cols-2 2xl:grid-cols-3 gap-4">
                                    {course.weeks
                                        .slice()
                                        .sort((a, b) => a.week - b.week)
                                        .map((week) => (
                                        <div key={week.week} className={`bg-white border rounded-2xl p-5 shadow-sm transition-all ${selectedWeek === week.week ? 'border-indigo-500 ring-2 ring-indigo-200 shadow-md' : 'border-slate-200 hover:border-indigo-200 hover:shadow-md'}`}>
                                            <div className="flex items-start justify-between gap-3 mb-3">
                                                <div>
                                                    <span className="inline-flex px-2.5 py-1 rounded-full text-[11px] font-bold bg-indigo-100 text-indigo-700">{week.week}주차</span>
                                                    <h4 className="font-bold text-slate-800 text-lg mt-2 leading-snug">{week.title}</h4>
                                                </div>
                                                <button onClick={() => handleGenerateMaterial(week)} className="bg-indigo-50 text-indigo-700 px-3 py-2 rounded-lg text-xs font-bold hover:bg-indigo-100 flex items-center gap-1 shrink-0">
                                                    <Icons.Sparkles size={14} /> AI 생성
                                                </button>
                                            </div>
                                            <div className="space-y-2">
                                                {week.topics.map((topic, idx) => (
                                                    <div key={idx} className="text-sm text-slate-600 bg-slate-50 border border-slate-100 rounded-lg px-3 py-2">
                                                        {topic}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                            <div className="p-4 border-b bg-slate-50 flex items-center gap-2">
                                <Icons.Sparkles className="text-indigo-600" size={18} /> <h3 className="font-bold text-slate-800">AI 콘텐츠 엔진</h3>
                            </div>
                            <div className="p-5">
                                {!generatedMaterial ? (
                                    <div className="py-16 flex flex-col items-center justify-center text-slate-400">
                                        <Icons.PlayCircle size={40} className="mb-3 opacity-30" />
                                        <p className="text-sm">위 주차별 모듈에서 AI 생성을 클릭하면 이 영역에 결과가 표시됩니다.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-5 animate-fade-in">
                                        <div>
                                            <h4 className="text-xs font-bold text-indigo-600 mb-2 flex items-center gap-1"><Icons.FileText size={14}/> PPT 흐름</h4>
                                            <div className="bg-slate-50 p-4 rounded-lg text-sm space-y-2 border">
                                                {generatedMaterial.outline.map((item, idx) => <p key={idx} className="text-slate-700 font-medium">{item}</p>)}
                                            </div>
                                        </div>
                                        <div>
                                            <h4 className="text-xs font-bold text-indigo-600 mb-2 flex items-center gap-1"><Icons.CheckCircle size={14}/> 핵심 개념</h4>
                                            <div className="bg-indigo-50/60 p-4 rounded-lg text-sm border border-indigo-100">
                                                <p className="text-slate-800 font-medium leading-relaxed">{generatedMaterial.concept}</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // 2. 평가 및 과제 설계
        function AssignmentsView({ course, isGenerating, setIsGenerating, setAiMessage, setErrorMsg, apiConfig, onSaveAssignment }) {
            const [generatedAssignment, setGeneratedAssignment] = useState(null);
            const [selectedTarget, setSelectedTarget] = useState(course.weeks[0]?.title || "");
            const [selectedBloom, setSelectedBloom] = useState("적용/분석 (프로젝트/사례연구)");
            const [selectedBankItemId, setSelectedBankItemId] = useState(null);

            const handleGenerate = async () => {
                const schema = { 
                    type: "OBJECT", 
                    properties: { 
                        title: { type: "STRING" }, 
                        description: { type: "STRING" }, 
                        rubric: { 
                            type: "ARRAY",
                            minItems: 3,
                            items: { 
                                type: "OBJECT",
                                properties: { 
                                    criteria: { type: "STRING" },
                                    desc: { type: "STRING" },
                                    points: { type: "NUMBER" } 
                                },
                                required: ["criteria", "desc", "points"]
                            } 
                        } 
                    }, 
                    required: ["title", "description", "rubric"] 
                };

                const targetWeekInfo = course.weeks.find(w => w.title === selectedTarget);
                const ragContext = (course.isLinkedToDrive && targetWeekInfo) ? `[구글 드라이브 교안 데이터]\n${XR_KNOWLEDGE_BASE[targetWeekInfo.week] || ''}` : "";
                const prompt = `과목명:${course.title}\n주제:${selectedTarget}\nBloom수준:${selectedBloom}\n${ragContext}\n과제 설명(description)과 루브릭(rubric) 생성`;

                const result = await runStructuredGeneration({
                    prompt,
                    schema,
                    apiConfig,
                    setAiMessage,
                    setIsGenerating,
                    setErrorMsg,
                    loadingMessage: "과제 및 평가 루브릭을 설계 중입니다..."
                });

                if(result) {
                    setGeneratedAssignment(result);
                    setSelectedBankItemId(null);
                }
            };

            const handleSaveAssignment = () => {
                if (!generatedAssignment) {

                                        <p className="text-sm text-slate-700">과제 뱅크 {assignmentBankCount}개, 루브릭 생성 및 저장 가능</p>

                    <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

                        <div className="divide-y divide-slate-100">

        // 3. AI 채점 및 피드백
        function EvaluationView({ course, isGenerating, setIsGenerating, setAiMessage, setErrorMsg, apiConfig, onUpdateSubmission, onSaveScore }) {
            const [activeStudent, setActiveStudent] = useState(null);
            const [aiFeedback, setAiFeedback] = useState(null);
            const [manualTitle, setManualTitle] = useState("");
            const [manualContent, setManualContent] = useState("");

            const submissionChartItems = [
                { label: "제출 완료", value: course.students.filter((student) => Boolean(student.submission?.content)).length },
                { label: "미제출", value: course.students.filter((student) => !student.submission?.content).length },
                { label: "채점 완료", value: course.students.filter((student) => typeof student.latestScore === "number").length }
            ];

            const scoreBandCounts = course.students.reduce((acc, student) => {
                if (typeof student.latestScore !== "number") {
                    acc["미채점"] += 1;
                } else if (student.latestScore >= 90) {
                    acc["90-100"] += 1;
                } else if (student.latestScore >= 80) {
                    acc["80-89"] += 1;
                } else if (student.latestScore >= 70) {
                    acc["70-79"] += 1;
                } else {
                    acc["0-69"] += 1;
                }
                return acc;
            }, { "90-100": 0, "80-89": 0, "70-79": 0, "0-69": 0, "미채점": 0 });

            const scoreChartItems = [
                { label: "90-100", value: scoreBandCounts["90-100"] },
                { label: "80-89", value: scoreBandCounts["80-89"] },
                { label: "70-79", value: scoreBandCounts["70-79"] },
                { label: "0-69", value: scoreBandCounts["0-69"] },
                { label: "미채점", value: scoreBandCounts["미채점"] }
            ];

            useEffect(() => {
                if (!activeStudent) return;

                const latestStudent = course.students.find((student) => student.id === activeStudent.id);
                if (latestStudent) {
                    setActiveStudent(latestStudent);
                }
            }, [course.students, activeStudent]);

            const applySubmissionUpdate = (submission, nextStatus = "미채점", nextTime = "방금 반영") => {
                if (!activeStudent) return;

                onUpdateSubmission(course.id, activeStudent.id, {
                    submission,
                    status: nextStatus,
                    time: nextTime
                });

                setActiveStudent((prev) => prev ? ({
                    ...prev,
                    submission,
                    status: nextStatus,
                    time: nextTime
                }) : prev);
                setAiFeedback(null);
            };

            const handleLoadFromLms = () => {
                if (!activeStudent) {
                    setErrorMsg("제출물을 불러올 학생을 먼저 선택해 주세요.");
                    return;
                }

                const submission = createMockSubmission(course.title, activeStudent.name, activeStudent.assignment);
                applySubmissionUpdate(submission, "미채점", "LMS 불러오기 완료");
            };

            const handleManualUpload = () => {
                if (!activeStudent) {
                    setErrorMsg("직접 업로드할 학생을 먼저 선택해 주세요.");
                    return;
                }

                const title = manualTitle.trim();
                const content = manualContent.trim();

                if (!title || !content) {
                    setErrorMsg("과제 제목과 제출 내용을 모두 입력해 주세요.");
                    return;
                }

                const submission = {
                    source: "manual",
                    title,
                    fileName: `${activeStudent.name}_${title.replace(/\s+/g, "_")}.txt`,
                    submittedAt: new Date().toLocaleString("ko-KR"),
                    content
                };

                applySubmissionUpdate(submission, "미채점", "교수 직접 업로드");
                setManualTitle("");
                setManualContent("");
            };

            const handleManualFile = async (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                try {
                    const text = await file.text();
                    setManualTitle(file.name.replace(/\.[^.]+$/, ""));
                    setManualContent(text);
                } catch (error) {
                    setErrorMsg("텍스트 기반 파일만 불러올 수 있습니다.");
                } finally {
                    event.target.value = "";
                }
            };
             
            const handleFeedback = async () => {
                if (!activeStudent) {
                    setErrorMsg("피드백을 생성할 학생을 먼저 선택해 주세요.");
                    return;
                }

                if (!activeStudent.submission?.content) {
                    setErrorMsg("채점할 제출물이 없습니다. LMS 제출을 불러오거나 교수 직접 업로드를 먼저 진행해 주세요.");
                    return;
                }

                const schema = { 
                    type: "OBJECT", 
                    properties: { 
                        score: { type: "NUMBER" }, strengths: { type: "STRING" }, weaknesses: { type: "STRING" }, suggestion: { type: "STRING" } 
                    }, 
                    required: ["score", "strengths", "weaknesses", "suggestion"] 
                };

                const ragContext = course.isLinkedToDrive ? `[구글 드라이브 교안 데이터]\n${XR_KNOWLEDGE_BASE[5] || ''}` : "";
                const submissionContext = [
                    `제출 제목:${activeStudent.submission.title || activeStudent.assignment || "과제 제출본"}`,
                    `제출 경로:${activeStudent.submission.source === "lms" ? "LMS 연동(가상)" : "교수 직접 업로드"}`,
                    `제출 시각:${activeStudent.submission.submittedAt || activeStudent.time || "미상"}`,
                    `제출 내용:\n${activeStudent.submission.content}`
                ].join("\n");
                const prompt = `과제 피드백\n학생이름:${activeStudent.name}\n${submissionContext}\n${ragContext}\n점수(score), 강점(strengths), 약점(weaknesses), 제언(suggestion) 생성`;

                const result = await runStructuredGeneration({
                    prompt,
                    schema,
                    apiConfig,
                    setAiMessage,
                    setIsGenerating,
                    setErrorMsg,
                    loadingMessage: "제출물을 분석하여 맞춤형 피드백을 생성 중입니다..."
                });

                if(result) setAiFeedback(result);
            };

            const handleSaveScore = () => {
                if (!activeStudent || !aiFeedback) {
                    setErrorMsg("저장할 AI 채점 결과가 없습니다.");
                    return;
                }

                onSaveScore(course.id, activeStudent.id, aiFeedback.score);
                setActiveStudent((prev) => prev ? ({
                    ...prev,
                    latestScore: aiFeedback.score,
                    status: "채점완료",
                    time: "AI 채점 저장 완료"
                }) : prev);
            };

            return (
                <div className="p-8 animate-fade-in flex flex-col h-full">
                    <header className="mb-6 border-b border-slate-200 pb-4">
                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><Icons.CheckSquare className="text-indigo-600" /> ③ AI 채점 및 피드백</h2>
                    </header>
                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-4 mb-6">
                        <MiniBarChart title="과제 제출 현황" items={submissionChartItems} colorClass="bg-indigo-500" />
                        <MiniBarChart title="성적 분포도" items={scoreChartItems} colorClass="bg-emerald-500" />
                    </div>
                    <div className="flex gap-6 flex-1 min-h-0">
                        <div className="w-1/4 bg-white border rounded-xl p-4 overflow-y-auto shadow-sm">
                            <h3 className="font-bold mb-3 border-b pb-2 text-sm"><Icons.Users size={16} className="inline mr-1"/> 제출 현황</h3>
                            {course.students.map(s => (
                                <div key={s.id} onClick={()=>{setActiveStudent(s); setAiFeedback(null);}} className={`p-3 cursor-pointer rounded-lg mb-2 ${activeStudent?.id===s.id ? 'bg-indigo-50 border border-indigo-200' : 'border border-transparent hover:bg-slate-50'}`}>
                                    <p className="font-bold text-sm">{s.name} <span className="text-[10px] text-amber-600 bg-amber-100 px-1 rounded ml-1">{s.status}</span></p>
                                    <p className="text-[11px] text-slate-500 mt-1">{s.submission?.title || "제출물 없음"}</p>
                                    <p className="text-[11px] text-slate-400 mt-1">{typeof s.latestScore === "number" ? `최근 점수 ${s.latestScore}점` : "점수 없음"}</p>
                                </div>
                            ))}
                        </div>
                        <div className="w-3/4 bg-white border rounded-xl p-6 flex flex-col shadow-sm overflow-y-auto">
                            {activeStudent ? (
                                <div className="flex flex-col h-full">
                                    <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                                        <h3 className="font-bold text-lg">{activeStudent.name} 학생 제출물</h3>
                                        <div className="flex flex-wrap gap-2">
                                            <button onClick={handleLoadFromLms} className="bg-indigo-50 text-indigo-700 px-3 py-2 rounded-lg text-sm font-bold hover:bg-indigo-100">
                                                LMS 제출 불러오기(가상)
                                            </button>
                                            <label className="bg-white border border-slate-300 px-3 py-2 rounded-lg text-sm font-bold text-slate-700 hover:bg-slate-50 cursor-pointer">
                                                파일 불러오기
                                                <input type="file" accept=".txt,.md,.html,.json,.csv" onChange={handleManualFile} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-1 xl:grid-cols-[1.15fr_0.85fr] gap-4 mb-4">
                                        <div className="bg-slate-50 rounded-lg border p-6 min-h-[280px]">
                                            {activeStudent.submission ? (
                                                <div className="space-y-3">
                                                    <div className="flex flex-wrap items-center gap-2">
                                                        <span className="px-2 py-1 rounded-full text-[11px] font-bold bg-indigo-100 text-indigo-700">
                                                            {activeStudent.submission.source === "lms" ? "LMS 연동(가상)" : "교수 직접 업로드"}
                                                        </span>
                                                        <span className="text-xs text-slate-500">{activeStudent.submission.submittedAt}</span>
                                                    </div>
                                                    <h4 className="font-bold text-slate-800">{activeStudent.submission.title}</h4>
                                                    <p className="text-xs text-slate-500">{activeStudent.submission.fileName}</p>
                                                    <pre className="bg-white border rounded-lg p-4 text-sm text-slate-700 whitespace-pre-wrap leading-relaxed max-h-[360px] overflow-y-auto">
{activeStudent.submission.content}
                                                    </pre>
                                                </div>
                                            ) : (
                                                <div className="h-full flex items-center justify-center text-center text-slate-400">
                                                    LMS 제출을 불러오거나 우측 입력란으로 교수가 직접 업로드해 주세요.
                                                </div>
                                            )}
                                        </div>

                                        <div className="bg-white border rounded-lg p-4">
                                            <h4 className="font-bold text-slate-800 mb-3">교수 직접 업로드</h4>
                                            <div className="space-y-3">
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-600 mb-1">과제 제목</label>
                                                    <input value={manualTitle} onChange={(e) => setManualTitle(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm" placeholder="예: XR 프로젝트 초안" />
                                                </div>
                                                <div>
                                                    <label className="block text-xs font-bold text-slate-600 mb-1">제출 내용</label>
                                                    <textarea value={manualContent} onChange={(e) => setManualContent(e.target.value)} className="w-full border rounded-lg px-3 py-2 text-sm h-44" placeholder="학생 제출 내용을 붙여넣거나 파일 불러오기로 채우세요." />
                                                </div>
                                                <button onClick={handleManualUpload} className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm hover:bg-slate-800">
                                                    교수 직접 업로드 반영
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    {!aiFeedback ? (
                                        <button onClick={handleFeedback} className="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 shadow"><Icons.Sparkles size={16} className="inline mr-2"/> 피드백 초안 생성</button>
                                    ) : (
                                        <div className="bg-white border border-indigo-200 p-5 rounded-lg shadow-sm animate-fade-in">
                                            <div className="flex justify-between items-center mb-3 border-b pb-2"><h4 className="font-bold text-indigo-900"><Icons.Sparkles size={16} className="inline mr-1"/> AI 초안</h4><span className="text-xl font-black text-indigo-600">{aiFeedback.score}점</span></div>
                                            <div className="space-y-3">
                                                <div><label className="text-xs font-bold text-green-600">강점</label><textarea className="w-full p-2 border rounded mt-1 text-sm font-medium" defaultValue={aiFeedback.strengths} rows="2"></textarea></div>
                                                <div><label className="text-xs font-bold text-amber-600">보완점</label><textarea className="w-full p-2 border rounded mt-1 text-sm font-medium" defaultValue={aiFeedback.weaknesses} rows="2"></textarea></div>
                                                <div><label className="text-xs font-bold text-indigo-600">제언</label><textarea className="w-full p-2 border rounded mt-1 text-sm font-medium" defaultValue={aiFeedback.suggestion} rows="2"></textarea></div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 mt-4">
                                                <button onClick={handleSaveScore} className="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-sm">점수 저장</button>
                                                <button className="w-full bg-slate-900 text-white font-bold py-2.5 rounded-lg text-sm">LMS 전송</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            ) : <div className="m-auto text-slate-400 text-center"><Icons.CheckSquare size={40} className="mx-auto mb-3 opacity-20"/><p>학생을 선택하세요.</p></div>}
                        </div>
                    </div>
                </div>
            );
        }

        // 4. 개입
        function InterventionView({ course, isGenerating, setIsGenerating, setAiMessage, setErrorMsg, apiConfig }) {
            const [email, setEmail] = useState(null);
            
            const handleEmail = async (student) => {
                const schema = { type: "OBJECT", properties: { subject: { type: "STRING" }, body: { type: "STRING" } }, required: ["subject", "body"] };
                const prompt = `문제상황:${student.issue}\n격려 및 면담 유도 이메일 작성`;

                const result = await runStructuredGeneration({
                    prompt,
                    schema,
                    apiConfig,
                    setAiMessage,
                    setIsGenerating,
                    setErrorMsg,
                    loadingMessage: "학생 데이터를 바탕으로 면담 메일을 작성 중입니다..."
                });

                if(result) setEmail(result);
            };

            return (
                <div className="p-8 animate-fade-in">
                    <header className="mb-6 border-b border-slate-200 pb-4">
                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><Icons.TrendingDown className="text-red-500" /> ④ 진도 점검 및 개입</h2>
                    </header>
                    <div className="flex gap-6">
                        <div className="w-1/2 space-y-4">
                            <h3 className="font-bold">⚠️ 위험군 목록</h3>
                            {course.atRiskStudents.length === 0 ? <p className="text-sm text-slate-400">위험 학생이 없습니다.</p> : 
                                course.atRiskStudents.map(s => (
                                    <div key={s.id} className="bg-white border border-red-200 rounded-xl p-4 shadow-sm">
                                        <div className="flex justify-between font-bold mb-2"><span>{s.name}</span><span className="text-red-600 text-xs">{s.severity}</span></div>
                                        <div className="bg-red-50 text-red-800 text-sm p-2 rounded mb-3 font-medium">{s.issue}</div>
                                        <button onClick={()=>handleEmail(s)} className="w-full bg-white border border-slate-300 py-2 rounded text-sm font-bold hover:bg-slate-50"><Icons.Mail size={16} className="inline mr-1"/> 메일 초안 생성</button>
                                    </div>
                                ))
                            }
                        </div>
                        <div className="w-1/2">
                            {email ? (
                                <div className="bg-white border border-indigo-200 rounded-xl p-6 shadow-lg animate-fade-in">
                                    <h3 className="font-bold text-indigo-900 mb-4 border-b pb-2"><Icons.Mail size={16} className="inline mr-1"/> 발송 초안</h3>
                                    <input className="w-full border p-2 text-sm font-bold mb-3 rounded" defaultValue={email.subject}/>
                                    <textarea className="w-full border p-3 text-sm font-medium rounded h-40" defaultValue={email.body}></textarea>
                                    <button className="w-full bg-indigo-600 text-white font-bold py-3 mt-4 rounded-lg shadow">LMS 발송</button>
                                </div>
                            ) : <div className="h-full min-h-[300px] border-2 border-dashed rounded-xl flex items-center justify-center text-slate-400 text-sm bg-slate-50/50">좌측에서 학생을 선택하세요.</div>}
                        </div>
                    </div>
                </div>
            );
        }

        // 5. 성찰 리포트
        function ReflectionView({ course, isGenerating, setIsGenerating, setAiMessage, setErrorMsg, apiConfig }) {
            const [report, setReport] = useState(null);
            
            const handleReport = async () => {
                const schema = { type: "OBJECT", properties: { achievement: { type: "STRING" }, patterns: { type: "STRING" }, suggestions: { type: "ARRAY", items: { type: "STRING" } } }, required: ["achievement", "patterns", "suggestions"] };
                const ragContext = course.isLinkedToDrive ? "과목: 메타버스, XR. 미드저니 실습 등" : "";
                const prompt = `강의종합분석\n${ragContext}\nachievement(성취도), patterns(오답/질문패턴), suggestions(개선점 3개) 작성`;

                const result = await runStructuredGeneration({
                    prompt,
                    schema,
                    apiConfig,
                    setAiMessage,
                    setIsGenerating,
                    setErrorMsg,
                    loadingMessage: "한 학기 데이터를 종합 분석 중입니다..."
                });

                if(result) setReport(result);
            };

            return (
                <div className="p-8 animate-fade-in">
                    <header className="mb-6 flex justify-between items-end border-b pb-4">
                        <h2 className="text-2xl font-bold text-slate-800 flex items-center gap-2"><Icons.BarChart className="text-indigo-600" /> ⑤ 과정 중심 성찰 및 개선</h2>
                        {!report && <button onClick={handleReport} className="bg-indigo-600 text-white px-5 py-2.5 rounded-lg font-bold text-sm shadow"><Icons.Sparkles size={16} className="inline mr-1"/> 리포트 도출</button>}
                    </header>
                    {!report ? (
                        <div className="bg-white border rounded-xl p-12 text-center text-slate-400 shadow-sm"><Icons.BarChart size={48} className="mx-auto mb-4 opacity-50"/><p>우측 상단의 버튼을 눌러 리포트를 생성하세요.</p></div>
                    ) : (
                        <div className="bg-white border border-slate-200 rounded-xl shadow-lg overflow-hidden animate-fade-in">
                            <div className="bg-slate-900 text-white p-5 text-center"><h3 className="text-xl font-black">{course.title} 강의 개선 리포트</h3></div>
                            <div className="p-6 space-y-6">
                                <div><h4 className="font-bold mb-2 flex items-center gap-1 text-slate-800"><Icons.CheckCircle size={16} className="text-green-500"/> 성취도 분석</h4><p className="bg-slate-50 p-4 rounded border text-sm font-medium text-slate-700 leading-relaxed">{report.achievement}</p></div>
                                <div><h4 className="font-bold mb-2 flex items-center gap-1 text-slate-800"><Icons.AlertCircle size={16} className="text-amber-500"/> 주요 오답 패턴</h4><p className="bg-slate-50 p-4 rounded border text-sm font-medium text-slate-700 leading-relaxed">{report.patterns}</p></div>
                                <div><h4 className="font-bold mb-2 flex items-center gap-1 text-slate-800"><Icons.Lightbulb size={16} className="text-indigo-600"/> 개선 제안</h4>
                                    <ul className="space-y-2">{report.suggestions.map((s,i)=><li key={i} className="bg-indigo-50 p-3 rounded border border-indigo-100 text-sm font-bold text-slate-700 flex gap-2"><span className="text-indigo-600">{i+1}.</span> {s}</li>)}</ul>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- [Main App Component Setup] ---
        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [apiConfig, setApiConfig] = useState({
                apiKey: "",
                model: OPENAI_MODELS.some((model) => model.value === localStorage.getItem(STORAGE_KEYS.model))
                    ? localStorage.getItem(STORAGE_KEYS.model)
                    : DEFAULT_OPENAI_MODEL
            });
            const [courses, setCourses] = useState(INITIAL_COURSES);
            const [currentMenu, setCurrentMenu] = useState('dashboard');
            const [activeCourseId, setActiveCourseId] = useState(INITIAL_COURSES[0].id);
            const [isGenerating, setIsGenerating] = useState(false);
            const [aiMessage, setAiMessage] = useState("");
            const [isAddModalOpen, setIsAddModalOpen] = useState(false);
            const [errorMsg, setErrorMsg] = useState("");

            const activeCourse = courses.find(c => c.id === activeCourseId) || courses[0];
            const handleNavigate = (menu, courseId = null) => { if (courseId) setActiveCourseId(courseId); setCurrentMenu(menu); };

            const handleAddCourse = (newCourse) => {
                setCourses([...courses, newCourse]);
                setActiveCourseId(newCourse.id);
            };

            const handleSaveAssignmentToBank = (courseId, assignmentRecord) => {
                setCourses((prevCourses) =>
                    prevCourses.map((course) =>
                        course.id === courseId
                            ? {
                                ...course,
                                assignmentBank: [...(course.assignmentBank || []), assignmentRecord]
                            }
                            : course
                    )
                );
            };

            const handleUpdateStudentSubmission = (courseId, studentId, updatePayload) => {
                setCourses((prevCourses) =>
                    prevCourses.map((course) =>
                        course.id === courseId
                            ? {
                                ...course,
                                students: course.students.map((student) =>
                                    student.id === studentId
                                        ? {
                                            ...student,
                                            submission: updatePayload.submission,
                                            status: updatePayload.status || student.status,
                                            time: updatePayload.time || student.time
                                        }
                                        : student
                                )
                            }
                            : course
                    )
                );
            };

            const handleSaveStudentScore = (courseId, studentId, score) => {
                setCourses((prevCourses) =>
                    prevCourses.map((course) =>
                        course.id === courseId
                            ? {
                                ...course,
                                students: course.students.map((student) =>
                                    student.id === studentId
                                        ? {
                                            ...student,
                                            latestScore: score,
                                            status: "채점완료",
                                            time: "AI 채점 저장 완료"
                                        }
                                        : student
                                )
                            }
                            : course
                    )
                );
            };

            const handleAddCourseWeek = (courseId, newWeek) => {
                setCourses((prevCourses) =>
                    prevCourses.map((course) =>
                        course.id === courseId
                            ? {
                                ...course,
                                weeks: [...course.weeks, newWeek].sort((a, b) => a.week - b.week)
                            }
                            : course
                    )
                );
            };

            const handleSaveCourseSyllabusText = (courseId, syllabusText) => {
                setCourses((prevCourses) =>
                    prevCourses.map((course) =>
                        course.id === courseId
                            ? {
                                ...course,
                                syllabusText
                            }
                            : course
                    )
                );
            };

            const handleImportSyllabusWeeks = (courseId, importedWeeks) => {
                setCourses((prevCourses) =>
                    prevCourses.map((course) =>
                        course.id === courseId
                            ? {
                                ...course,
                                weeks: importedWeeks
                            }
                            : course
                    )
                );
            };

            const handleLogin = (nextApiConfig) => {
                setApiConfig(nextApiConfig);
                setIsLoggedIn(true);
            };

            if (!isLoggedIn) return <LoginScreen onLogin={handleLogin} initialModel={apiConfig.model} />;

            return (
                <div className="flex h-screen bg-slate-50 text-slate-800">
                    {/* 사용자 정의 Error Modal (Alert 창을 완벽하게 대체) */}
                    <ErrorModal message={errorMsg} onClose={() => setErrorMsg("")} />

                    <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 z-10 shadow-xl">
                        <div className="p-6">
                            <h1 className="text-xl font-bold text-white flex items-center gap-2"><Icons.Sparkles size={24} className="text-indigo-400" /> AI EdTech</h1>
                            <p className="text-[10px] text-slate-500 mt-2">상태: {apiConfig.apiKey ? '직접 입력한 OpenAI API 연결' : '앱 기본 OpenAI API 연결 대기'}</p>
                            <p className="text-[10px] text-slate-500 mt-1">모델: {apiConfig.model}</p>
                        </div>
                        <nav className="flex-1 px-4 space-y-2 overflow-y-auto mt-2">
                            <NavItem iconName="LayoutDashboard" label="대시보드" active={currentMenu === 'dashboard'} onClick={() => handleNavigate('dashboard')} />
                            <div className="pt-4 pb-2">
                                <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider px-2 mb-2 flex items-center gap-1"><Icons.FolderOpen size={14}/> 내 강의실</p>
                                <div className="space-y-1">
                                    {courses.map(c => (
                                        <div key={c.id} onClick={() => setActiveCourseId(c.id)} className={`px-3 py-2 rounded-lg border cursor-pointer transition-colors relative ${activeCourseId === c.id ? 'bg-indigo-600 border-indigo-500 text-white shadow' : 'bg-slate-800 border-slate-700 text-slate-300 hover:bg-slate-700'}`}>
                                            <p className="text-sm font-medium truncate pr-4">{c.title}</p>
                                            {c.isLinkedToDrive && <div className="absolute top-2.5 right-2 text-green-400"><Icons.Database size={14} /></div>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                            <div className="pt-4 space-y-1 border-t border-slate-800 mt-2">
                                <NavItem iconName="BookOpen" label="① 강의 및 자료 설계" active={currentMenu === 'syllabus'} onClick={() => handleNavigate('syllabus')} />
                                <NavItem iconName="FileQuestion" label="② 평가 및 루브릭" active={currentMenu === 'assignments'} onClick={() => handleNavigate('assignments')} />
                                <NavItem iconName="CheckSquare" label="③ AI 채점 및 피드백" active={currentMenu === 'evaluation'} onClick={() => handleNavigate('evaluation')} />
                                <NavItem iconName="TrendingDown" label="④ 진도 점검 및 개입" active={currentMenu === 'intervention'} onClick={() => handleNavigate('intervention')} />
                                <NavItem iconName="BarChart" label="⑤ 성찰 및 개선" active={currentMenu === 'reflection'} onClick={() => handleNavigate('reflection')} />
                                <NavItem iconName="Database" label="⑥ LMS 연동 센터" active={currentMenu === 'lms'} onClick={() => handleNavigate('lms')} />
                            </div>
                        </nav>
                    </aside>

                    <main className="flex-1 overflow-y-auto relative bg-slate-50">
                        {currentMenu === 'dashboard' && <DashboardView courses={courses} onNavigate={handleNavigate} onOpenAddModal={() => setIsAddModalOpen(true)} />}
                        {currentMenu === 'syllabus' && <SyllabusView key={`syl-${activeCourse.id}`} course={activeCourse} isGenerating={isGenerating} setIsGenerating={setIsGenerating} setAiMessage={setAiMessage} setErrorMsg={setErrorMsg} apiConfig={apiConfig} onAddWeek={handleAddCourseWeek} onSaveSyllabusText={handleSaveCourseSyllabusText} onImportSyllabusWeeks={handleImportSyllabusWeeks} />}
                        {currentMenu === 'assignments' && <AssignmentsView key={`ass-${activeCourse.id}`} course={activeCourse} isGenerating={isGenerating} setIsGenerating={setIsGenerating} setAiMessage={setAiMessage} setErrorMsg={setErrorMsg} apiConfig={apiConfig} onSaveAssignment={handleSaveAssignmentToBank} />}
                        {currentMenu === 'evaluation' && <EvaluationView key={`eval-${activeCourse.id}`} course={activeCourse} isGenerating={isGenerating} setIsGenerating={setIsGenerating} setAiMessage={setAiMessage} setErrorMsg={setErrorMsg} apiConfig={apiConfig} onUpdateSubmission={handleUpdateStudentSubmission} onSaveScore={handleSaveStudentScore} />}
                        {currentMenu === 'intervention' && <InterventionView key={`int-${activeCourse.id}`} course={activeCourse} isGenerating={isGenerating} setIsGenerating={setIsGenerating} setAiMessage={setAiMessage} setErrorMsg={setErrorMsg} apiConfig={apiConfig} />}
                        {currentMenu === 'reflection' && <ReflectionView key={`ref-${activeCourse.id}`} course={activeCourse} isGenerating={isGenerating} setIsGenerating={setIsGenerating} setAiMessage={setAiMessage} setErrorMsg={setErrorMsg} apiConfig={apiConfig} />}
                        {currentMenu === 'lms' && <LmsIntegrationView key={`lms-${activeCourse.id}`} course={activeCourse} onNavigate={handleNavigate} />}
                        
                        {activeCourse.isLinkedToDrive && (
                            <div className="absolute top-6 right-8 flex items-center gap-2 bg-green-50 text-green-700 px-4 py-2 rounded-full text-xs font-bold border border-green-200 shadow-sm animate-pulse-slow">
                                <Icons.Database size={14} /> Drive DB 연동 (RAG On)
                            </div>
                        )}
                    </main>

                    {/* AI Loading Overlay */}
                    {isGenerating && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center animate-fade-in">
                            <div className="bg-white rounded-2xl p-8 shadow-2xl flex flex-col items-center max-w-sm w-full mx-4 text-center border border-indigo-100">
                                <div className="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center mb-6 animate-pulse border border-indigo-100">
                                    <Icons.Sparkles size={32} className="text-indigo-600 animate-spin-slow" />
                                </div>
                                <h3 className="text-lg font-bold text-slate-800 mb-2">AI 어시스턴트 작동 중</h3>
                                <p className="text-sm text-slate-600 mb-6 font-medium">{aiMessage}</p>
                                <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden"><div className="bg-indigo-600 h-full w-1/2 rounded-full animate-progress"></div></div>
                            </div>
                        </div>
                    )}

                    <AddCourseModal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} onAdd={handleAddCourse} setErrorMsg={setErrorMsg} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
